name: Dependency review

# Thin caller of the shared implementation in lukislp/ci-workflows - the triggers stay here
# because a reusable workflow cannot declare them for the caller. The only manifest in this
# repository is the set of GitHub Actions the workflows use, so this is what stops a pull request
# from introducing an action release with a known advisory. The check name in the branch ruleset
# is "review / dependency-review".
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    uses: lukislp/ci-workflows/.github/workflows/dependency-review.yml@d6ea7363956999dc7b3695e8b446f6361b102c6b # v1.5.4
    # pull-requests: write is what the summary comment needs; the called workflow keeps
    # contents at read.
    permissions:
      contents: read
      pull-requests: write
