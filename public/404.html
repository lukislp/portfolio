<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seite nicht gefunden — lktec.org</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{--bg:#0b0f14;--card:#131b25;--text:#e6edf3;--muted:#8b98a9;--line:#1f2a37;--accent:#4fd1c5;--accent2:#7c6cf0}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;line-height:1.7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{max-width:520px;text-align:center}
.code{font-size:clamp(4rem,18vw,7rem);font-weight:800;line-height:1;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:1.4rem;margin:10px 0 8px}
p{color:var(--muted);font-size:.95rem;margin-bottom:26px}
a.btn{display:inline-block;background:var(--accent);color:#04211d;font-weight:700;padding:11px 22px;border-radius:10px;text-decoration:none;transition:opacity .2s}
a.btn:hover{opacity:.85}
</style>
</head>
<body>
<div class="box">
  <div class="code">404</div>
  <h1>Diese Seite gibt es nicht.</h1>
  <p>Der Link ist vermutlich veraltet oder enthält einen Tippfehler.</p>
  <a class="btn" href="/">Zur Startseite</a>
</div>
</body>
</html>
